[workspace]
members = [".", "crates/datapod-macros"]

[package]
name = "datapod"
version = "0.4.1"
edition = "2024"
description = "Rust robotics data types and POD-oriented containers"
license = "MIT"
readme = "README.md"
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3"]

# Many adapter helpers live in the crate as a staging ground for future
# consumers — silence `unused` / `dead_code` lint spam so downstream
# crates don't drown in noise when they `cargo build`.
[lints.rust]
dead_code = "allow"
unused = "allow"

[dependencies]
# bytemuck powers the POD derive on the fixed-layout types
# (spatial primitives, matrix vectors, temporal stamps, scalar
# wrappers). Heap-backed types (multi-geometries, trees, sequence
# containers) keep their natural Rust layout and are NOT Pod.
bytemuck = { version = "1", features = ["derive"] }

# datapod-macros provides #[derive(DataPod)] and #[dp(bytes)]. Re-exported
# from the crate root so users write `use datapod::DataPod;`.
datapod-macros = { path = "crates/datapod-macros", version = "0.0.1" }
pyo3 = { version = "0.23", optional = true, features = [
    "abi3-py39",
    "extension-module",
] }

[[example]]
name = "wire_bench_scaffold"
path = "examples/rust/wire_bench_scaffold.rs"

[[example]]
name = "wire_fixture"
path = "examples/rust/wire_fixture.rs"
