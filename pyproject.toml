[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "robolibs-datapod"
version = "0.4.1"
description = "Python bindings for the robolibs datapod wire-contract library"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Operating System :: OS Independent",
]

[tool.maturin]
features = ["python"]
module-name = "datapod"
