[package]
name = "datapod-macros"
version = "0.0.1"
edition = "2024"
description = "Procedural macros for datapod (#[derive(DataPod)] and #[dp(bytes)])"
license = "MIT"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
